defmodule ArenaChat do
  use GenServer

  def start_link(_), do: GenServer.start_link(__MODULE__, %{}, name: __MODULE__)
  def send_message(room, text), do: GenServer.call(__MODULE__, {:broadcast, room, text})

  @impl true
  def init(rooms), do: {:ok, rooms}

  @impl true
  def handle_call({:broadcast, room, text}, _from, rooms) do
    IO.puts("[Elixir Chat] #{room} >> #{text}")
    {:reply, :ok, Map.update(rooms, room, [text], &[text | &1])}
  end

%% 50 - Erlang - Fault-Tolerant Distributed Telecom Logic
-module(logic).
-export([start/0, ping/2]).

ping(0, Pid) -> Pid ! finished;
ping(N, Pid) -> Pid ! {ping, N}, ping(N - 1, Pid).

start() ->
    io:format("Erlang: Fault-Tolerant Distributed Telecom Logic online.~n"),
    Self = self(),
    spawn(fun() -> ping(2, Self) end),
    receive {ping, N} -> io:format("  received ping ~p~n", [N]) end,
    receive finished -> io:format("  telecom link stable.~n") end,
    ok.
</script>

# joke_ws_gen.py  ->  writes joke_ws.ws
# 59 - Whitespace - Invisible Spaces and Tabs Joke Language
S, T, L = " ", "\t", "\n"

def push(n):
    sign = S if n >= 0 else T
    bits = bin(abs(n))[2:].replace("0", S).replace("1", T)
    return S + S + sign + bits + T          # SS  sign  digits  LF

OUT_CHAR = T + S + S                        # Tab Space Space = output character

def ws_program(text):
    body = "".join(push(ord(c)) + OUT_CHAR for c in text)
    return body + L + L + L                 # end of program

with open("joke_ws.ws", "w", encoding="utf-8") as f:
    f.write(ws_program("Whitespace OK\n"))

print("Whitespace: Invisible Spaces and Tabs Joke Language -> wrote joke_ws.ws")
</script>

    { n: 32, name: "Clojure Concurrency Model",      file: "concurrency.clj",  cmd: "clojure concurrency.clj",      out: "[clojure] 12 futures deref'd - immutable state intact" },
    { n: 33, name: "Elixir Multi-Thread Core",       file: "core.ex",          cmd: "elixir core.ex",               out: "[elixir] 1000 processes spawned - supervisor tree green" },
    { n: 34, name: "Groovy Runtime Injector",        file: "injector.groovy",  cmd: "groovy injector.groovy",       out: "[groovy] runtime bytecode injected" },
    { n: 35, name: "YAML Modern Resource Map",       file: "resources.yaml",   cmd: "yq . resources.yaml",          out: "[yaml] 5 resources mapped" },
    { n: 36, name: "Gradle Build Automation Tasks",  file: "build.gradle",     cmd: "gradle build --quiet",         out: "[gradle] BUILD SUCCESSFUL in 0.8s" },
    { n: 37, name: "Shell POSIX Environment Config", file: "env.sh",           cmd: "sh env.sh",                    out: "[sh] PATH exported - arena env ready" },
    { n: 38, name: "INI Graphic Resolution Matrix",  file: "resolution.ini",   cmd: "cat resolution.ini",           out: "[ini] 1920x1080 @ 144hz loaded" },
    { n: 39, name: "Markdown Overview Document",     file: "overview.md",      cmd: "glow overview.md",             out: "[markdown] # Polyglot Arena - rendered" },
    { n: 40, name: "Befunge 2D Grid Instruction Field", file: "grid.bef",      cmd: "bef grid.bef",                 out: "[befunge] IP travelled 2D grid - output \"Arena\"" }
  ];

  const LATE = Array.prototype.map.call(
    document.querySelectorAll('script[type="text/plain"][id^="src-"]'),
    function (el) {
      return {
        n: Number(el.id.slice(4)),
        name: el.dataset.lang,
        file: el.dataset.file,
        role: el.dataset.role,
        cmd: el.dataset.cmd,
        out: el.dataset.out || "",
        src: el.textContent.replace(/^\n/, "").replace(/\s+$/, "")
      };
    }
  );

  const ALL = EARLY.concat(LATE).sort(function (a, b) { return a.n - b.n; });
  const byNumber = {};
  ALL.forEach(function (e) { byNumber[e.n] = e; });

  const listEl = document.getElementById("lang-list");
  const consoleEl = document.getElementById("console");
  const filterEl = document.getElementById("filter");

  /* ---------- build the 60 buttons ---------- */
  ALL.forEach(function (e) {
    const btn = document.createElement("button");
    btn.className = "lang-btn";
    btn.dataset.n = e.n;
    btn.dataset.search = (e.n + " " + e.name + " " + e.file).toLowerCase();
    btn.innerHTML =
      '<span class="num">' + String(e.n).padStart(2, "0") + "</span>" +
      '<span class="txt">' + escapeHtml(e.name) +
      '<span class="ext">' + escapeHtml(e.file) + "</span></span>";
    btn.addEventListener("click", function () { select(e.n); });
    listEl.appendChild(btn);
  });

  /* ---------- filtering ---------- */
  filterEl.addEventListener("input", function () {
    const q = filterEl.value.trim().toLowerCase();
    Array.prototype.forEach.call(listEl.children, function (btn) {
      btn.style.display = (!q || btn.dataset.search.indexOf(q) !== -1) ? "" : "none";
    });
  });

  /* ---------- console rendering ---------- */
  function escapeHtml(s) {
    return String(s).replace(/[&<>]/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c];
    });
  }

  function line(text, cls) {
    const d = document.createElement("div");
    d.className = cls || "";
    d.textContent = text;
    consoleEl.appendChild(d);
  }

  function select(n) {
    const e = byNumber[n];
    if (!e) return;

    Array.prototype.forEach.call(listEl.children, function (b) {
      b.classList.toggle("active", Number(b.dataset.n) === n);
    });

    consoleEl.innerHTML = "";
    const pad = String(n).padStart(2, "0");

    line("arena@polyglot:~$ polyglot-arena run " + pad, "cmd");
    line("[arena] module " + pad + "/60 · " + e.name, "info");
    line("[file]  " + e.file, "dim");
    if (e.role) line("[role]  " + e.role, "role");

    if (e.src) {
      line("-".repeat(64), "rule");
      e.src.split("\n").forEach(function (l) { line(l, "src"); });
      line("-".repeat(64), "rule");
    }

    line("arena@polyglot:~$ " + e.cmd, "cmd");
    String(e.out || "").split("\n").forEach(function (l) { line(l, "out"); });
    line("[exit] 0 — handshake complete", "ok");
    line("", "dim");

    consoleEl.scrollTop = 0;
  }

  /* ---------- boot ---------- */
  line("Polyglot Arena Game Hub :: terminal v60.0", "ok");
  line("[boot] " + ALL.length + " language modules indexed (1-60).", "info");
  line("[boot] select a module from the left panel to execute it.", "dim");
  line("", "dim");
  select(1);
})();
</script>
</body>
</html>
