<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Polyglot Arena Game Hub — 60 Languages</title>
<style>
  :root{
    --bg:#070b10;--panel:#0d141c;--line:#1d2b38;
    --fg:#c7f5d9;--dim:#5d7b8c;--neon:#39ff88;
    --amber:#ffcc66;--cyan:#5ce1e6;--pink:#ff79c6;
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0;background:var(--bg);color:var(--fg);
    font-family:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;overflow:hidden}
  .app{display:grid;grid-template-columns:350px 1fr;height:100vh}
  .sidebar{background:var(--panel);border-right:1px solid var(--line);
    display:flex;flex-direction:column;min-height:0}
  .brand{padding:16px;border-bottom:1px solid var(--line)}
  .brand h1{margin:0;font-size:15px;letter-spacing:2px;color:var(--neon)}
  .brand p{margin:4px 0 0;font-size:11px;color:var(--dim)}
  .search{padding:10px 12px;border-bottom:1px solid var(--line)}
  .search input{width:100%;background:#050a0e;border:1px solid var(--line);
    border-radius:4px;color:var(--fg);padding:7px 10px;font:inherit;font-size:12px;outline:none}
  .search input:focus{border-color:var(--neon)}
  .lang-list{flex:1;overflow-y:auto;padding:8px;display:flex;flex-direction:column;gap:4px}
  .lang-btn{display:grid;grid-template-columns:38px 1fr;gap:8px;align-items:center;
    background:transparent;border:1px solid transparent;border-radius:5px;
    color:var(--fg);font:inherit;font-size:12px;text-align:left;padding:7px 9px;cursor:pointer}
  .lang-btn:hover{background:#111c26;border-color:var(--line)}
  .lang-btn.active{background:#0f2a1d;border-color:var(--neon)}
  .lang-btn .num{color:var(--dim);font-size:11px}
  .lang-btn.active .num{color:var(--neon)}
  .lang-btn .txt{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .lang-btn .ext{display:block;font-size:10px;color:var(--dim)}
  .console-wrap{display:flex;flex-direction:column;min-height:0}
  .titlebar{display:flex;align-items:center;gap:8px;padding:10px 16px;
    border-bottom:1px solid var(--line);background:#0a1017}
  .dot{width:11px;height:11px;border-radius:50%}
  .dot.r{background:#ff5f57}.dot.y{background:#febc2e}.dot.g{background:#28c840}
  .titlebar span.path{margin-left:10px;font-size:11px;color:var(--dim)}
  #console{flex:1;overflow:auto;padding:18px 22px;white-space:pre-wrap;
    word-break:break-word;font-size:12.5px;line-height:1.55}
  #console div{min-height:1.55em}
  .cmd{color:var(--neon)}.info{color:var(--cyan)}.role{color:var(--pink)}
  .dim{color:var(--dim)}.src{color:#8fb9a8}.out{color:var(--amber)}
  .ok{color:var(--neon)}.rule{color:#1f3a4d}
  ::-webkit-scrollbar{width:9px}::-webkit-scrollbar-track{background:#050a0e}
  ::-webkit-scrollbar-thumb{background:#1d2b38;border-radius:6px}
  @media(max-width:820px){.app{grid-template-columns:1fr;grid-template-rows:38vh 1fr}
    .sidebar{border-right:none;border-bottom:1px solid var(--line)}}
</style>
</head>
<body>
<div class="app">

    <div class="brand"><h1>POLYGLOT ARENA</h1><p>GAME HUB · 60 LANGUAGES · 60 EXTENSIONS</p></div>

    <div id="lang-list" class="lang-list"></div>

      <span class="path">arena@polyglot: ~/polyglot-arena-game-hub</span>
    </div>
    <div id="console"></div>
  </main>
</div>

/* ============ UI ============ */
const listEl = document.getElementById("lang-list");
const consoleEl = document.getElementById("console");
const filterEl = document.getElementById("filter");

function escapeHtml(s){
  return String(s).replace(/[&<>]/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
}

MODULES.forEach(m=>{
  const btn = document.createElement("button");
  btn.className = "lang-btn";
  btn.dataset.n = m.n;
  btn.dataset.search = (m.n+" "+m.lang+" "+m.file).toLowerCase();
  btn.innerHTML = '<span class="num">'+String(m.n).padStart(2,"0")+'</span>'+
                  '<span class="txt">'+escapeHtml(m.lang)+
                  '<span class="ext">'+escapeHtml(m.file)+'</span></span>';
  btn.addEventListener("click", ()=>select(m.n));
  listEl.appendChild(btn);
});

filterEl.addEventListener("input", ()=>{
  const q = filterEl.value.trim().toLowerCase();
  Array.from(listEl.children).forEach(b=>{
    b.style.display = (!q || b.dataset.search.includes(q)) ? "" : "none";
  });
});

function line(text, cls){
  const d = document.createElement("div");
  d.className = cls||"";
  d.textContent = text;
  consoleEl.appendChild(d);
}

function select(n){
  const m = MODULES.find(x=>x.n===n);
  if(!m) return;
  Array.from(listEl.children).forEach(b=>{
    b.classList.toggle("active", Number(b.dataset.n)===n);
  });
  consoleEl.innerHTML = "";
  const pad = String(n).padStart(2,"0");
  line("arena@polyglot:~$ polyglot-arena run "+pad, "cmd");
  line("[arena] module "+pad+"/60 · "+m.lang, "info");
  line("[file]  "+m.file, "dim");
  line("-".repeat(64), "rule");
  m.src.split("\n").forEach(l=>line(l, "src"));
  line("-".repeat(64), "rule");
  line("arena@polyglot:~$ "+m.cmd, "cmd");
  m.out.split("\n").forEach(l=>line(l, "out"));
  line("[exit] 0 — handshake complete", "ok");
  consoleEl.scrollTop = 0;
}

line("Polyglot Arena Game Hub :: terminal v60.0", "ok");
line("[boot] 60 language modules indexed (1-60).", "info");
line("[boot] select a module from the left panel to execute it.", "dim");
